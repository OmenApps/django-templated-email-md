[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-templated-email-md"
version = "2025.10.2"
description = "An extension for django-templated-email for creating emails with Markdown"
authors = [{ name = "Jack Linke", email = "jacklinke@gmail.com" }]
license = "MIT"
readme = "README.md"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "asgiref>=3.6",
    "django>=4.2.15",
    "django-render-block>=0.8",
    "django-templated-email>=3.0",
    "html2text>=2024.2",
    "markdown>=3.7",
    "premailer>=3.10",
]

[project.optional-dependencies]
sanitize = ["nh3>=0.2.18"]

[project.urls]
Homepage = "https://github.com/OmenApps/django-templated-email-md"
Repository = "https://github.com/OmenApps/django-templated-email-md"
Documentation = "https://django-templated-email-md.readthedocs.io"
Changelog = "https://github.com/OmenApps/django-templated-email-md/releases"

[dependency-groups]
dev = [
    "bandit==1.8.6",
    "coverage[toml]==7.11.0",
    "darglint==1.8.1",
    "django-anymail==13.1",
    "flake8-bugbear==25.10.21",
    "flake8-docstrings==1.7.0",
    "flake8-rst-docstrings==0.4.0",
    "flake8==7.3.0",
    "furo==2025.9.25",
    "linkify-it-py==2.0.3",
    "myst-parser==4.0.1",
    "nh3>=0.2.18",
    "nox[pbs]==2025.10.16",
    "pep8-naming==0.15.1",
    "pre-commit-hooks==6.0.0",
    "pre-commit==4.3.0",
    "psycopg-binary==3.2.11",
    "Pygments==2.20.0",
    "pytest-cov==7.0.0",
    "pytest-django==4.11.1",
    "pytest==9.0.3",
    "python-environ==0.4.54",
    "pyupgrade==3.21.0",
    "ruff==0.15.14",
    "pip-audit>=2.7.3",
    "sphinx-autobuild==2025.8.25",
    "sphinx-click==6.1.0",
    "sphinx==8.2.3",
    "xdoctest[colors]==1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
templated_email_md = ["templates/templated_email/*", "templates/templated_email/components/*", "locale/**", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".nox"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["example_project", "*/example_project"]

[tool.coverage.run]
branch = true
source = ["src", "example_project"]

[tool.coverage.report]
show_missing = true
fail_under = 50
omit = [".nox/*", "example_project/*", "**/migrations/*", "**/__init__.py"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.settings"
python_files = ["*test_*.py", "*_test.py", "example_project/*.py"]
log_cli = true
log_cli_level = "INFO"
